<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍-->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    * {
      margin: 0px;
      padding: 0px;
      color: white;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
background-color: rgb(15, 15, 15);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 310px;
      padding: 10px;
      border-radius: 10px;
     background-color:rgb(23, 23, 23);
    }

    img {
      width: 80px;
      border-radius: 50%;
      margin-top: 24px;

    }


    h1{
      margin-top: 20px;
      font-size: 25px;
    }
     h2{
      margin-top: 8px;
      font-size: 15px;
      color: yellowgreen;
    }


p{
  margin-top: 22px;
}
    #buttons {

      display: flex;
      flex-direction: column;
      margin-top: 13px;
margin-bottom: 17px;
    }

    button {

      margin: 6px;
      padding: 12px 80px;
      border-radius: 7px;
      background-color: rgb(51, 50, 50);
      color: aliceblue;
border: none;
font-weight:bold;

    }
    button:hover {
  background-color: yellowgreen;
  color: black;
}
  </style>
</head>

<body>
  <div class="container">
    <div id="img"> <img src="./assets/images/avatar-jessica.jpeg" alt=""></div>
    <h1>Jessica Randall</h1>
    <h2>London, United Kingdom</h2> 
    <p>"Front-end developer and avid reader." </p>

    <div id="buttons">
      <button>GitHub</button>
      <button> Frontend Mentor</button>
      <button> LinkedIn</button>
      <button>Twitter</button>
      <button>Instagram</button>
    </div>
  </div>
</body>

</html>
