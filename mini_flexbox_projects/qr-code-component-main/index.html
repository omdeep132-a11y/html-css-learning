<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }


    img {
      height: 260px;
      width: 260px;
      border-radius: 10px;
    }

    h1 {
      font-size: 18px;
      text-align: center;
    }

    .container {
      height: 441px;
      width: 285px;

    }

    p {
      font-size: 13px;
      color: rgb(106, 111, 116);


    }

    body {

      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgb(225, 231, 237);
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: start;
      background-color: aliceblue;
      border-radius: 10px;

    }

    #content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

    }

    p {
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="img">
      <img src="./images/image-qr-code.png" alt="">
    </div>
    <div id="content">
      <h1>Improve your front-end <br> skills by building projects</h1>

      <p>&nbsp;Scan the QR code to visit Frontend <br>Mentor and take your coding skills to <br> the next level </p>
    </div>

  </div>
</body>

</html>
